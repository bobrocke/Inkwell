<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <!-- clip to full bottle interior -->
    <clipPath id="fv-clip">
      <path d="M22,20 L10,27 L10,56 Q10,60 14,60 L50,60 Q54,60 54,56 L54,27 L42,20 L42,14 L22,14 Z"/>
    </clipPath>
  </defs>

  <!-- rounded-square background -->
  <rect width="64" height="64" rx="13" fill="url(#fv-bg)"/>

  <!-- bottle body -->
  <path d="M10,27 L10,56 Q10,60 14,60 L50,60 Q54,60 54,56 L54,27 Z"
        fill="rgba(255,255,255,0.88)"/>

  <!-- shoulders -->
  <path d="M22,20 L10,27 L54,27 L42,20 Z"
        fill="rgba(255,255,255,0.88)"/>

  <!-- neck -->
  <rect x="22" y="14" width="20" height="8" rx="3"
        fill="rgba(255,255,255,0.88)"/>

  <!-- ink fill (clipped) -->
  <g clip-path="url(#fv-clip)">
    <rect x="9" y="42" width="46" height="20" fill="#1e1b4b"/>
    <!-- ink surface wave -->
    <path d="M9,42 Q20,36 31,42 Q42,48 53,42"
          fill="none" stroke="#4f46e5" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- cap -->
  <rect x="19" y="7" width="26" height="9" rx="4.5"
        fill="rgba(255,255,255,0.95)"/>
</svg>
